# This file defines settings for all modules that link against BlueExposure
Imports:
- ../CcpCore/uses_CcpCore.yaml

BaseConfigurations:
  ExeFile:
    Link:
      AdditionalLibraryDirectories:
      - ../../autobuild/BlueExposure/exefile/$(Platform)/$(PlatformToolset)

  Python_26:
    Link:
      AdditionalLibraryDirectories:
      - ../../autobuild/BlueExposure/python_26/$(Platform)/$(PlatformToolset)

  Python_27:
    Link:
      AdditionalLibraryDirectories:
      - ../../autobuild/BlueExposure/python_27/$(Platform)/$(PlatformToolset)

  Lua:
    Link:
      AdditionalLibraryDirectories:
      - ../../autobuild/BlueExposure/lua/$(Platform)/$(PlatformToolset)

  Debug:
    Link:
      AdditionalDependencies:
      - BlueExposure_d.lib

  Release:
    Link:
      AdditionalDependencies:
      - BlueExposure.lib

Configurations:
  Debug|Win32,x64:
    BaseConfigurations:
    - ExeFile
    - Debug

  DebugLua|Win32,x64:
    BaseConfigurations:
    - Lua
    - Debug

  DebugLua|ORBIS:
    BaseConfigurations:
    - Lua
    Link:
      AdditionalDependencies:
      - BlueExposure_d

  Release|Win32,x64:
    BaseConfigurations:
    - ExeFile
    - Release

  Release_26|Win32,x64:
    BaseConfigurations:
    - Python_26
    - Release

  Release_27|Win32,x64:
    BaseConfigurations:
    - Python_27
    - Release

  Release_27|Win32,x64,Linux32,Linux64,Mac32,Mac64:
    Link:
      AdditionalLibraryDirectories:
      - ../../../carbon/autobuild/BlueExposure/python_27/$(Platform)/$(PlatformToolset)
      AdditionalDependencies:
      - BlueExposure.lib

  DebugLua|Tegra-Android:
    BaseConfigurations:
    - Lua
    Link:
      AdditionalDependencies:
      - BlueExposureStatic_d

  ReleaseLua|Tegra-Android:
    BaseConfigurations:
    - Lua
    Link:
      AdditionalDependencies:
      - BlueExposureStatic
